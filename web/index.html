<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Só Serviços Prestador: serviços de apoio ao domicílio em Luanda.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Só Serviços Prestador">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Só Serviços Prestador</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const provider = (
        params.get('mapProvider') ||
        window.localStorage.getItem('MAP_PROVIDER') ||
        'google'
      ).toLowerCase();

      window.APP_MAP_PROVIDER = provider;
      window.gm_authFailure = function() {
        console.error('[MAPS] Falha de autenticação do Google Maps. Verifique a chave e o faturação do projeto.');
      };

      if (provider !== 'google') return;

      const script = document.createElement('script');
      const apiKey = window.GOOGLE_MAPS_API_KEY || '';
      if (!apiKey) return;
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&v=weekly&language=pt-PT&region=AO`;
      script.async = true;
      document.head.appendChild(script);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
